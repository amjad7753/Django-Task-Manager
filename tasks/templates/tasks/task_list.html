<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير المهام الاحترافي</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8f9fa; color: #343a40; }
        .main-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .btn-add { border-radius: 10px; padding: 10px 25px; transition: 0.3s; }
        .task-item { border: none; border-bottom: 1px solid #eee; transition: 0.2s; }
        .task-item:hover { background-color: #fdfdfd; transform: scale(1.01); }
        .form-control { border-radius: 10px; border: 1px solid #e0e0e0; padding: 12px; }
        .badge-custom { padding: 8px 12px; border-radius: 8px; font-weight: normal; }
        .tooltip-inner { background-color: #333; border-radius: 5px; padding: 5px 10px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h2 class="text-center fw-bold mb-4">🎯 مدير المهام الذكي</h2>

            <!-- قسم البحث والإضافة -->
          <div class="card main-card p-4 mb-4">
    <div class="d-flex gap-2">
        <input type="text" id="liveSearch" class="form-control" placeholder="ابحث عن مهمة..." value="{{ search_query }}">
        
        <a href="{% url 'task_list' %}" class="btn btn-light border" id="clearSearch" style="display: none;">إلغاء</a>
    </div>

    <hr class="text-muted">

    <form method="POST">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <input type="text" name="title" class="form-control" placeholder="ما هي مهمتك القادمة؟" required>
            <button class="btn btn-primary btn-add" type="submit">إضافة</button>
        </div>
    </form>
</div>
       
            <!-- قائمة المهام -->
            <div class="card main-card">
                <div class="list-group list-group-flush rounded-3">
                    {% for task in tasks %}
                        <div class="list-group-item task-item d-flex justify-content-between align-items-center p-3">
                            <div>
                                <span class="fs-5 {% if task.completed %}text-decoration-line-through text-muted{% endif %}">
                                    {{ task.title }}
                                </span>
                            </div>
                            
                            <div class="d-flex align-items-center gap-2">
                                <!-- زر الحالة مع Tooltip -->
                                <span data-bs-toggle="tooltip" title="تغيير الحالة">
                                    <a href="{% url 'task_complete' task.id %}" class="text-decoration-none">
                                        <span class="badge badge-custom {% if task.completed %}bg-success-subtle text-success{% else %}bg-warning-subtle text-warning-emphasis{% endif %}">
                                            {% if task.completed %}تمت{% else %}انتظار{% endif %}
                                        </span>
                                    </a>
                                </span>

                                <!-- زر التعديل (تم فصل الـ Tooltip عن الـ Modal) -->
                                <span data-bs-toggle="tooltip" title="تعديل المهمة" data-bs-placement="top">
                                    <button class="btn btn-sm btn-light text-primary border-0" 
                                            data-bs-toggle="modal" 
                                            data-bs-target="#editModal{{ task.id }}">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                                          <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                          <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                        </svg>
                                    </button>
                                </span>
                                
                                <!-- زر الحذف مع Tooltip -->
                                <span data-bs-toggle="tooltip" title="حذف المهمة" data-bs-placement="top">
                                    <button class="btn btn-sm btn-light text-danger border-0" 
                                            onclick="confirmDelete('{% url 'task_delete' task.id %}')">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                                            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                                            <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                                        </svg>
                                    </button>
                                </span>
                            </div>
                        </div>

                        <!-- نافذة التعديل (Modal) لكل مهمة -->
                        <div class="modal fade" id="editModal{{ task.id }}" tabindex="-1" aria-hidden="true">
                          <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content main-card">
                              <div class="modal-header border-0">
                                <h5 class="modal-title fw-bold">تعديل المهمة</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                              </div>
                              <form action="{% url 'task_update' task.id %}" method="POST">
                                {% csrf_token %}
                                <div class="modal-body">
                                  <input type="text" name="title" class="form-control" value="{{ task.title }}" required>
                                </div>
                                <div class="modal-footer border-0">
                                  <button type="button" class="btn btn-light" data-bs-dismiss="modal">إلغاء</button>
                                  <button type="submit" class="btn btn-primary btn-add">حفظ التغييرات</button>
                                </div>
                              </form>
                            </div>
                          </div>
                        </div>

                    {% empty %}
                        <div class="p-5 text-center text-muted">
                            <p>لا توجد مهام حالياً.</p>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle (يجب أن يكون في النهاية لضمان عمل المودال) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // 1. تفعيل التلميحات (Tooltips)
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })

        // 2. محرك البحث اللحظي (Live Search)
        const searchInput = document.getElementById('liveSearch');
        const clearBtn = document.getElementById('clearSearch');
        const taskItems = document.querySelectorAll('.task-item');

        searchInput.addEventListener('input', function () {
            const query = this.value.toLowerCase().trim();
            
            // إظهار/إخفاء زر الإلغاء
            clearBtn.style.display = query.length > 0 ? 'block' : 'none';

            taskItems.forEach(item => {
                const taskTitle = item.querySelector('.fs-5').textContent.toLowerCase();
                
                // إذا كانت الكلمة موجودة، اظهر الصف، وإذا لا، اخفهِ
                if (taskTitle.includes(query)) {
                    item.style.setProperty('display', 'flex', 'important');
                } else {
                    item.style.setProperty('display', 'none', 'important');
                }
            });
        });
    });

    // وظيفة تأكيد الحذف (SweetAlert2)
    function confirmDelete(deleteUrl) {
        Swal.fire({
            title: 'هل أنت متأكد؟',
            text: "لن تتمكن من استعادة هذه المهمة بعد الحذف!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'نعم، احذفها',
            cancelButtonText: 'إلغاء',
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = deleteUrl;
            }
        })
    }
</script>
</body>
</html>
