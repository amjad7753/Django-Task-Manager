<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير المهام الاحترافي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8f9fa; color: #343a40; }
        .main-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .btn-add { border-radius: 10px; padding: 10px 25px; transition: 0.3s; }
        .task-item { border: none; border-bottom: 1px solid #eee; transition: 0.2s; }
        .task-item:hover { background-color: #fdfdfd; transform: scale(1.01); }
        .form-control { border-radius: 10px; border: 1px solid #e0e0e0; padding: 12px; }
        .badge-custom { padding: 8px 12px; border-radius: 8px; font-weight: normal; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h2 class="text-center fw-bold mb-4">🎯 مدير المهام الذكي</h2>

            <div class="card main-card p-4 mb-4">
                <form method="GET" class="mb-3">
                    <div class="input-group">
                        <input type="text" name="search" class="form-control" placeholder="ابحث عن مهمة..." value="{{ search_query }}">
                        <button class="btn btn-outline-secondary" type="submit">بحث</button>
                    </div>
                </form>

                <hr class="text-muted">

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <input type="text" name="title" class="form-control" placeholder="ما هي مهمتك القادمة؟" required>
                        <button class="btn btn-primary btn-add" type="submit">إضافة</button>
                    </div>
                </form>
            </div>

            <div class="card main-card">
                <div class="list-group list-group-flush rounded-3">
                    {% for task in tasks %}
                        <div class="list-group-item task-item d-flex justify-content-between align-items-center p-3">
                            <div>
                                <span class="fs-5 {% if task.completed %}text-decoration-line-through text-muted{% endif %}">
                                    {{ task.title }}
                                </span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <a href="{% url 'task_complete' task.id %}" class="text-decoration-none">
                                    <span class="badge badge-custom {% if task.completed %}bg-success-subtle text-success{% else %}bg-warning-subtle text-warning-emphasis{% endif %}">
                                        {% if task.completed %}تمت{% else %}انتظار{% endif %}
                                    </span>
                                </a>
                                
                                <a href="javascript:void(0);" 
                                   class="btn btn-sm btn-light text-danger border-0" 
                                   onclick="confirmDelete('{% url 'task_delete' task.id %}')">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                                        <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                                        <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                                    </svg>
                                </a>
                            </div>
                        </div>
                    {% empty %}
                        <div class="p-5 text-center text-muted">
                            <p>لا توجد مهام مطابقة للبحث أو القائمة فارغة.</p>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function confirmDelete(deleteUrl) {
    Swal.fire({
        title: 'هل أنت متأكد؟',
        text: "لن تتمكن من التراجع عن حذف هذه المهمة!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'نعم، احذفها!',
        cancelButtonText: 'إلغاء',
        reverseButtons: true, // لجعل "إلغاء" على اليمين بما يتناسب مع العربية
        customClass: {
            popup: 'rounded-4'
        }
    }).then((result) => {
        if (result.isConfirmed) {
            window.location.href = deleteUrl;
        }
    })
}
</script>
</body>
</html>
